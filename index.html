<!DOCTYPE html>
<html lang="en" data-theme="day">
<head>
<meta data-hb charset="utf-8">
<meta data-hb name="viewport" content="width=device-width, initial-scale=1">
<title data-hb>Housebook – Central Penthouse at Teatro Massimo</title>
<link data-hb rel="preconnect" href="https://fonts.googleapis.com">
<link data-hb rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link data-hb href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<style data-hb>
:root{
  --bg:#FFFFFF; --panel:#F7EFDF; --card:#FFFFFF; --line:#DDD0B8; --ink:#2B2622; --muted:#5A5048; --rule:#2B2622;
  --terra:#C2542D; --blue:#1F5A73; --green:#5E7A3E; --ochre:#9A6A0B; --cinnamon:#86502A; --wine:#8F2D3F; --gold:#C9A25C;
  --solid:#C2542D; --on-solid:#FFFFFF; --bar:rgba(255,255,255,.92); --shadow:0 1px 0 rgba(43,38,34,.04);
}
[data-theme="night"]{
  --bg:#191613; --panel:#2A241E; --card:#211D19; --line:#4B4035; --ink:#F3EBDC; --muted:#C2B6A4; --rule:#8C7F6E;
  --terra:#E58A66; --blue:#7DBAD4; --green:#A5C283; --ochre:#DDAA4A; --cinnamon:#DDA27A; --wine:#E08A9C; --gold:#C9A25C;
  --solid:#B94E29; --on-solid:#FFFFFF; --bar:rgba(25,22,19,.92); --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Lora',Georgia,'Times New Roman',serif;font-size:15.5px;line-height:1.5;transition:background .25s,color .25s}
main p,.rules span,.duo>div>div,.hint>span,.dlg p{text-align:justify;hyphens:manual;-webkit-hyphens:manual}
main .hero p,main p.eyebrow,.callnum{text-align:center;hyphens:manual;-webkit-hyphens:manual}
main .sh p{text-align:left;hyphens:manual;-webkit-hyphens:manual}
@media (min-width:1200px){main .hero p{text-align:left}}
[hidden]{display:none!important}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.ic{width:1em;height:1em;display:inline-block;vertical-align:-.14em;flex:none}
[data-acc=terra]{--acc:var(--terra)}[data-acc=blue]{--acc:var(--blue)}[data-acc=green]{--acc:var(--green)}[data-acc=ochre]{--acc:var(--ochre)}[data-acc=wine]{--acc:var(--wine)}[data-acc=cinnamon]{--acc:var(--cinnamon)}

/* top bar */
.bar{position:sticky;top:0;z-index:20;background:var(--bar);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{padding:8px 12px;min-height:56px;box-sizing:border-box;display:flex;align-items:center;gap:10px}
.ibtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:19px;color:var(--muted);flex:none;text-decoration:none}
.ibtn:hover{color:var(--ink);border-color:var(--muted)}
.bar #btnTheme{width:26px;height:26px;font-size:13px}
.brand{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0;line-height:1.15}
.brand b{display:block;font-size:17px;font-weight:600;color:var(--blue)}
.brand b i{font-style:normal}
@media (max-width:640px){.brand b{font-size:14.5px;line-height:1.18}.brand b .l2{display:block}#crumb{display:none}}
.brand span{display:block;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card);flex:none}
.seg button{border:0;background:none;padding:0 7px;height:24px;font-size:10.5px;font-weight:600;letter-spacing:.08em;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--blue);color:var(--bg)}

main{margin-left:var(--rw);padding:18px 14px 40px;min-height:80vh;box-sizing:border-box}
.page{max-width:1320px}
:root{--rw:62px}
@media (min-width:960px){:root{--rw:300px}main{padding:22px 40px 50px}}
html.wide.rc{--rw:62px}
main{transition:margin-left .22s ease}
#rail{position:fixed;left:0;top:57px;bottom:0;width:var(--rw);background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;overscroll-behavior:contain;z-index:30;scrollbar-width:none;transition:width .22s ease,box-shadow .22s}
#rail::-webkit-scrollbar{display:none}
#rail .hd,#rail .nm,#rail .subs,#rail .ft{display:none}
#rail .ri{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);padding:8px 0;flex-direction:column;justify-content:center;min-height:58px;border-bottom:1px solid var(--line);position:relative}
#rail .ri .rn{display:none;font-size:21px;line-height:1;color:var(--acc)}
#rail .ri .ic{font-size:23px;color:var(--acc)}
#rail .ri.on{background:var(--card)}
#rail .ri.on:after{content:"";position:absolute;right:-1px;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--acc)}
#rail.open,.wide:not(.rc) #rail{width:300px}
#rail.open{box-shadow:6px 0 30px rgba(20,16,12,.25)}
#rail.open .hd,#rail.open .nm,#rail.open .ft,.wide:not(.rc) #rail .hd,.wide:not(.rc) #rail .nm,.wide:not(.rc) #rail .ft{display:block}
#rail.open .ri,.wide:not(.rc) #rail .ri{flex-direction:row;justify-content:flex-start;padding:12px 16px 12px 10px;min-height:0;gap:6px}
#rail.open .ri>.ic,.wide:not(.rc) #rail .ri>.ic{font-size:21px;width:34px}
#rail .nm{font-size:15.5px;line-height:1.25}
#rail .ri.on .nm{font-weight:700}
#rail .subs{padding:0 0 8px 50px;background:var(--card);border-bottom:1px solid var(--line)}
#rail .subs a{display:block;font-size:13.5px;color:var(--muted);text-decoration:none;padding:4px 10px 4px 0}
#rail .subs a:hover{color:var(--acc)}
#rail .hd{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
#rail .hd .eyebrow{margin:0 0 4px}
#rail .hd b{display:block;font-size:20px;color:var(--blue);line-height:1.2}
#rail .ft{padding:14px 16px 24px}
#rail .ft a{display:flex;align-items:center;gap:10px;text-decoration:none;padding:6px 0;font-size:14.5px}
#rail .ft .ic{color:var(--terra);font-size:17px}
#rail .ft .wf{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14.5px;background:none;border:0;color:var(--ink);cursor:pointer;width:100%;text-align:left}
#rail .ft .wf .ic{color:var(--terra);font-size:17px}
#scrim{position:fixed;inset:57px 0 0 0;background:rgba(20,16,12,.35);z-index:25}
.wide #scrim{display:none}
.page{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.page{animation:none}html{scroll-behavior:auto}}
img{max-width:100%;height:auto;display:block}
.illus{border-radius:14px;width:100%;height:auto}
[data-theme=night] .illus,[data-theme=night] .thumb img,[data-theme=night] .trip>img{filter:brightness(.88)}

/* home */
.hero{text-align:center;padding:6px 0 4px}
.hero .eyebrow{margin:4px 0 6px}
.hero h1{font-size:clamp(28px,8vw,40px);line-height:1.12;margin:0;color:var(--blue);font-weight:700}
.hero h1 span{display:block;font-weight:600;font-size:.62em;margin-top:4px}
.hero .apt2{font-style:italic;color:var(--muted);font-size:13.5px;margin:6px 0 14px}
.hero .illus{width:100%;height:auto}
.hero .tag{font-style:italic;color:var(--muted);margin:10px 0 0;font-size:15px}
.hero .tag span{color:var(--terra);font-style:normal;letter-spacing:.06em;font-size:13px;white-space:nowrap}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 16px}
.qa{display:flex;flex-direction:column;align-items:center;text-align:center!important;gap:4px;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 12px;text-decoration:none;text-align:left;min-width:0}
.qa>.ic{font-size:20px;color:var(--terra);flex:none}
.qa b{display:block;font-size:15px;line-height:1.2}.qa small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qa span{min-width:0}
.qa.sos{background:var(--solid);border-color:var(--solid);color:var(--on-solid);justify-content:center}
.qa.sos .n{font-size:22px;line-height:20px;font-weight:700}.qa.sos small{color:var(--on-solid);opacity:.9;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
@media (max-width:400px){.qa small{font-size:10.5px}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 12px 14px;text-decoration:none;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto 1fr;row-gap:4px;transition:transform .15s,border-color .15s}
.tile:hover{border-color:var(--acc);transform:translateY(-1px)}
.tile .tn{font-size:40px;line-height:1;color:var(--acc)}
.tile .cir{width:36px;height:36px;font-size:17px;background:var(--card)}
.tile b{grid-column:1/-1;font-size:16.5px;line-height:1.2;margin-top:6px}
.tile small{grid-column:1/-1;font-size:12px;color:var(--muted);line-height:1.4}
.welcome{margin-top:16px;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:0 14px}
.welcome summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 0;cursor:pointer}
.welcome summary::-webkit-details-marker{display:none}
.welcome summary>.ic:first-child{font-size:20px;color:var(--terra)}
.welcome summary b{display:block}.welcome summary small{display:block;font-size:12.5px;color:var(--muted)}
.welcome summary .chev{margin-left:auto;color:var(--muted);transition:transform .2s}
.welcome[open] summary .chev{transform:rotate(90deg)}
.welcome.open{border:0;background:none;padding:0;margin-top:0}
.welcome.open .prose{border-top:0;padding-top:0}
.home .cta{display:flex;justify-content:center;margin:6px auto 18px;max-width:320px}
.welcome .prose{border-top:1px solid var(--line);padding-top:12px}
.welcome .lead{font-style:italic;font-size:17px;color:var(--blue);max-width:none;margin:0 0 .7em}
.welcome .illus{margin:4px 0 14px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(20,16,12,.45);display:flex;align-items:flex-end;justify-content:center;padding:12px;animation:fade .2s}
.dlg{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;width:100%;max-width:520px;position:relative;margin-bottom:max(8px,env(safe-area-inset-bottom))}
.dlg .x{position:absolute;top:12px;right:12px;width:36px;height:36px;font-size:15px}
@media (min-width:640px){.modal{align-items:center}}
.chips{position:sticky;top:57px;z-index:10;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;background:var(--bg);margin:0 -14px 14px;padding:10px 14px;border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
@media (min-width:960px){.chips{margin:0 -40px 18px;padding:10px 40px}}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;text-decoration:none;color:var(--muted);background:var(--card)}
.chips a:hover{border-color:var(--acc);color:var(--acc)}
.sheet{scroll-margin-top:110px;margin-bottom:28px}
.sheet .sb{padding:0 2px}
.pf{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-top:1px solid var(--line);margin-top:22px;padding-top:10px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.pf>:last-child{text-align:right}
.pf .pno{letter-spacing:.05em;font-size:13px}
.pfi{width:26px;height:26px;border-radius:50%;border:1px solid var(--muted);display:grid;place-items:center;font-size:13px;color:var(--muted)}
/* cover */
.cover{text-align:center;padding:14px 0 10px}
.cover .apt{color:var(--blue);font-weight:600;font-size:17px;margin:0}
.cover .apt2{font-style:italic;color:var(--muted);font-size:13px;margin:2px 0 18px}
.cover h1{font-size:clamp(52px,15vw,84px);line-height:1;margin:0;color:var(--blue);font-weight:700;letter-spacing:-.01em}
.kicker{display:flex;align-items:center;justify-content:center;gap:16px;color:var(--terra);letter-spacing:.42em;font-size:12px;margin:14px 0 22px;text-transform:uppercase}
.kicker:before,.kicker:after{content:"";width:44px;height:1px;background:var(--gold)}
.cover .tag{font-style:italic;color:var(--muted);margin:22px 0 10px;font-size:17px}
.cover .hosts{color:var(--terra);letter-spacing:.36em;font-size:11.5px;text-transform:uppercase;margin:0 0 24px}
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--blue);color:var(--bg);border:0;border-radius:999px;padding:12px 26px;font-weight:600;font-size:16px;text-decoration:none}

/* welcome / contents */
.eyebrow{color:var(--terra);letter-spacing:.42em;font-size:11px;text-transform:uppercase;margin:6px 0 4px}
.big{font-size:clamp(38px,10vw,52px);color:var(--blue);margin:0 0 10px;line-height:1.1;font-weight:700}
.center{text-align:center}
.lead{font-style:italic;font-size:19px;margin:0 auto 18px;max-width:22em}
.prose p{margin:0 0 .75em}
.sign{font-style:italic}
.toc{border-top:1.5px solid var(--rule);margin-top:14px}
.toc-row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.toc-num{font-size:34px;line-height:1;color:var(--acc);width:1.5em;text-decoration:none}
.toc-t{font-size:19px;font-weight:600;text-decoration:none;display:block}
.toc-s{font-size:13.5px;color:var(--muted);line-height:1.5}
.toc-s a{text-decoration:none}.toc-s a:hover,.toc-t:hover{text-decoration:underline}
.cir{width:40px;height:40px;border-radius:50%;border:1.2px solid var(--acc);background:var(--panel);color:var(--acc);display:grid;place-items:center;font-size:19px;flex:none;text-decoration:none}
.hint{display:flex;gap:10px;font-size:13.5px;color:var(--muted);margin-top:16px;align-items:flex-start}
.hint .ic{color:var(--terra);font-size:17px;margin-top:2px}
.hint b{color:var(--ink)}

/* section header */
.sh{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;scroll-margin-top:110px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;margin-bottom:20px}
.sh .num{font-size:clamp(52px,14vw,72px);line-height:.9;color:var(--acc);font-weight:400}
.sh h1{font-size:clamp(24px,6.6vw,34px);margin:0;line-height:1.12;font-weight:700;color:var(--acc)}
.sh p{margin:6px 0 0;color:var(--muted);font-size:14.5px;line-height:1.35}
.sh .badge{width:56px;height:56px;border-radius:50%;border:1.2px solid var(--acc);background:var(--card);color:var(--acc);display:grid;place-items:center;font-size:27px}
@media (max-width:520px){.sh{padding:12px;gap:10px}.sh .num{font-size:48px}.sh h1{font-size:22px}.sh p{font-size:13px}.sh .badge{width:40px;height:40px;font-size:19px}}
.h2{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:600;margin:22px 0 8px;scroll-margin-top:124px}
.h2.ruled{padding-bottom:8px;border-bottom:1.2px solid var(--rule);margin-bottom:0}
.part{display:flex;align-items:center;gap:12px;color:var(--muted);font-style:italic;font-size:14.5px;margin:30px 0 12px;scroll-margin-top:110px}
.part:before,.part:after{content:"";flex:1;height:1px;background:var(--line)}
.intro{margin:0 0 14px}
.note{font-size:13.5px;color:var(--muted);display:flex;gap:8px;align-items:center;margin:0 0 4px}
.note .ic{color:var(--acc)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.host{display:grid;grid-template-columns:1fr 1fr;padding:18px}
.host>div{display:flex;gap:12px}
.host>div+div{border-left:1px solid var(--line);padding-left:16px}
.host a{text-decoration:none}
.lbl{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.host .nm{font-size:21px;font-weight:600;line-height:1.25}
.host small{display:block;color:var(--muted);font-size:13.5px;margin-top:8px}
.telbig{font-size:21px;font-weight:600;color:var(--acc);text-decoration:none;white-space:nowrap}
@media (max-width:440px){.host{grid-template-columns:1fr;gap:14px;padding:14px}.host>div+div{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:14px}}
.airbnb{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-top:12px;text-decoration:none}
.airbnb img{width:36px;height:36px;border-radius:50%}
.airbnb b{display:block;font-weight:600}.airbnb span{font-size:13.5px;color:var(--muted)}
.airbnb .ic{margin-left:auto;color:var(--acc);font-size:20px}
.emg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.emg a{border:1.2px solid var(--acc);border-radius:14px;text-align:center;padding:18px 4px 16px;text-decoration:none;background:var(--card)}
.emg b{display:block;font-size:clamp(28px,9vw,48px);line-height:1;color:var(--acc);font-weight:700}
.emg span{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;margin-top:12px;line-height:1.6}
.emg a.main{background:var(--solid);border-color:var(--solid);color:var(--on-solid)}.emg a.main b{color:var(--on-solid)}
@media (max-width:520px){.emg{gap:6px}.emg a{padding:12px 2px 10px;border-radius:10px}.emg span{font-size:7.5px;letter-spacing:.1em;margin-top:8px}}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.row .t{font-weight:600}.row .a{font-size:13.5px;color:var(--muted)}
.row .a a{color:inherit}
.tel{color:var(--acc);font-weight:600;text-decoration:none;white-space:nowrap}
.row .tel{font-size:18px}
.place{text-decoration:none;font-weight:600}
.place .ic{color:var(--acc);font-size:.8em;vertical-align:-.05em}
.place:hover{text-decoration:underline}
.prose .place,.trip .place{color:var(--acc);text-decoration:underline;text-underline-offset:2px}
.hosp{display:grid;grid-template-columns:auto 1fr auto;gap:14px;padding:16px;margin-bottom:10px;align-items:center}
.hosp .t{font-size:17px}
.hosp .a{font-size:13.5px;color:var(--muted)}.hosp .a b{color:var(--ink)}
.hosp .tels{border-left:1px solid var(--line);padding-left:14px;display:flex;flex-direction:column;gap:4px}
.hosp .tels small{font-style:italic;color:var(--muted);font-size:12px;max-width:11em}
@media (max-width:520px){.hosp{grid-template-columns:auto 1fr}.hosp .tels{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);padding:10px 0 0;flex-direction:row;flex-wrap:wrap;gap:6px 18px}}
.banner{background:var(--solid);color:var(--on-solid);border-radius:14px;padding:16px 18px;display:flex;gap:16px;align-items:center;margin-top:14px}
.banner a{color:inherit;text-decoration:none}.banner .n{font-size:34px;font-weight:700;line-height:1}

/* apartment */
.dear{color:var(--acc);font-style:italic;font-size:19px;margin:0 0 2px}
.item{display:grid;grid-template-columns:auto 1fr;gap:12px;margin-top:14px;scroll-margin-top:110px}
.item h3{margin:4px 0 3px;font-size:18px;font-weight:600}
.item p{font-size:14.5px}
.item p{margin:0 0 .35em}
.sched{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;border-top:1.2px solid var(--rule);border-bottom:1.2px solid var(--rule);margin:8px 0 4px}
.sched>div>div{display:grid;grid-template-columns:6.4em 1fr;padding:7px 0;border-bottom:1px solid var(--line);align-items:center}
.sched>div>div:last-child{border-bottom:0}
.sched .d{color:var(--acc);font-weight:600}
.sched .w{display:flex;gap:8px;align-items:center}
.sched .none{color:var(--muted);padding-left:24px}
.bin{width:16px;height:18px;flex:none}
@media (max-width:560px){.sched{grid-template-columns:1fr}.sched>div:first-child>div:last-child{border-bottom:1px solid var(--line)}}
.wifi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:12px}
.wifi .f{flex:1 1 auto;text-align:center;align-self:flex-start}
.wifi .v{font-size:clamp(18px,5.4vw,22px);font-weight:600;color:var(--acc);display:block;margin-top:2px;white-space:nowrap}
.wifi .qr{display:flex;align-items:center;gap:12px;border-left:1px solid var(--line);padding-left:18px;font-size:12.5px;letter-spacing:.08em;color:var(--muted);margin:0 auto}
.wifi .qr img{width:104px;height:104px;background:#fff;padding:7px;border-radius:10px;border:1px solid var(--line);image-rendering:pixelated}
.copy{border:1px solid var(--line);background:var(--card);border-radius:999px;font-size:12px;padding:3px 12px;margin-top:6px;color:var(--muted)}
@media (max-width:560px){.wifi .qr{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:14px;width:100%;justify-content:center}}
.rules{list-style:none;margin:6px 0 0;padding:0}
.rules li{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:6px 0}
.rules .ic{color:var(--acc);font-size:21px;margin-top:3px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;border:1.2px solid var(--acc);color:var(--acc);border-radius:999px;padding:1px 10px;font-size:12px;font-weight:600;white-space:nowrap;text-decoration:none;background:var(--card);line-height:1.5}
.pill.solid{background:var(--acc);color:var(--bg)}
.pill .ic{font-size:12px}
.pills{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.apps{display:inline-flex;align-items:center;border:1.2px solid var(--acc);border-radius:999px;padding:1px 1px 1px 10px;font-size:12px;font-weight:600;color:var(--acc);gap:8px;background:var(--card)}
.apps span{background:var(--acc);color:var(--bg);border-radius:999px;padding:2px 11px;display:inline-flex;gap:7px}
.apps span a{color:inherit;text-decoration:none}.apps span a:hover{text-decoration:underline}
.apps span i{font-style:normal;opacity:.55}

/* transport */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media (max-width:620px){.cmp{grid-template-columns:1fr}}
.cmp .card{overflow:hidden}
.cmp .hd{background:var(--panel);display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.cmp .hd b{font-size:18px;display:block;line-height:1.2}.cmp .hd small{color:var(--muted);font-size:13.5px}
.cmp .hd .cir{background:var(--card)}
.cmp dl{margin:0}
.cmp dl>div{display:grid;grid-template-columns:6.6em 1fr;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:15px}
.cmp dl>div:last-child{border-bottom:0}
.cmp dt{font-weight:600;color:var(--muted);font-size:13px;line-height:1.5;padding-top:1px}
.cmp dt small{display:block;font-weight:400}
.cmp dd{margin:0}.cmp dd small{color:var(--muted);font-size:14px}
.cmp .buy{float:right;background:var(--acc);color:var(--bg);border-radius:6px;padding:2px 12px;font-size:13px;font-weight:600;text-decoration:none;margin-left:8px}
.stop{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:7px}
.stop .place{font-weight:400;color:var(--acc);text-decoration:underline;text-underline-offset:2px}
.fine{font-size:13px;color:var(--muted);margin:10px 2px}
.fine a{color:var(--acc);text-decoration:none}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px;font-size:14.5px}
.duo>div{display:grid;grid-template-columns:auto 1fr;gap:12px}
.duo>div+div{border-left:1px solid var(--line);padding-left:16px}
.duo .cir{width:34px;height:34px;font-size:16px}
@media (max-width:620px){.duo{grid-template-columns:1fr}.duo>div+div{border-left:0;padding-left:0}}
.duo a{color:inherit;text-decoration:none}

/* lists */
.list{display:grid;grid-template-columns:1fr 1fr;gap:0 26px}
.list.one{grid-template-columns:1fr}
@media (max-width:620px){.list{grid-template-columns:1fr}}
.list .row .t{font-weight:600}
.list small{font-weight:400;color:var(--muted);font-size:12.5px}

/* sights */
.sight{display:flow-root;padding:10px 12px 12px 10px;margin-bottom:10px}
.thumb{float:left;width:32%;margin:0 12px 6px 0;display:block;border-radius:8px;overflow:hidden}
.thumb img{width:100%;height:auto;display:block}
.ithumb{width:64px;height:64px;border-radius:50%;border:1.2px solid var(--acc);background:var(--panel);color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:28px;text-decoration:none}
@media (max-width:520px){.ithumb{width:52px;height:52px;font-size:23px}}
.sight .b{padding:0}
.sight h3{margin:0 0 3px;font-size:17.5px;font-weight:600}
.sight p{margin:0;font-size:14.5px;line-height:1.45}
.sight .pills{margin-top:8px}
.sight .pills{clear:none}
@media (max-width:520px){.sight{padding:9px 10px 10px 9px}.thumb{margin-right:10px}.sight h3{font-size:16px}.sight p{font-size:13.5px}}

/* trips */
.trip{overflow:hidden;margin-bottom:16px}
.trip>img{width:100%;border-bottom:1px solid var(--line)}
.trip .b{padding:14px 18px 18px}
.trip h2{display:flex;align-items:center;gap:12px;font-size:20px;margin:0 0 10px;font-weight:600;line-height:1.3;scroll-margin-top:110px}.trip h2 .pill{margin-left:8px;vertical-align:.12em}
.trip h2 .place{color:var(--ink);text-decoration:none}
.trip p{margin:0 0 .7em}
.trip p a.x{color:var(--acc);text-decoration:none}

/* notes */
.notes{width:100%;min-height:60vh;border:0;border-top:1px solid var(--line);background:repeating-linear-gradient(var(--bg),var(--bg) 39px,var(--line) 39px,var(--line) 40px);background-attachment:local;line-height:40px;font:inherit;font-size:17px;line-height:40px;color:var(--ink);padding:0 4px;resize:vertical;outline:none;border-radius:0}
.saved{font-size:12.5px;color:var(--muted);font-style:italic;margin:8px 0 0}

/* page nav */
.pn{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-top:6px;font-size:14px;color:var(--ink)}
.pn>a:not(.ibtn){background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px;line-height:1.25}
.pn small{display:block;font-size:11px;color:var(--muted);letter-spacing:.1em}
.pn a{text-decoration:none;display:flex;align-items:center;gap:6px;min-height:40px}
.pn a:last-child{justify-content:flex-end;text-align:right}
.pn .ibtn{width:36px;height:36px;font-size:16px;justify-content:center}
.pn .ic{font-size:16px}
.err{background:#b00;color:#fff;padding:8px}
.eyebrow.wl{text-align:center;margin:4px 0 10px}
.note.hn{margin:8px 0 12px}
.nw{white-space:nowrap}
.illus.ed{aspect-ratio:3.55/1;width:100%;height:auto;object-fit:cover}
.illus.edm{object-position:50% 35%}
.sight .addr{font-size:12.5px;color:var(--muted);margin:-1px 0 4px;text-align:left}
.facts{list-style:none;margin:8px 0 0;padding:0;font-size:13px;color:var(--muted);clear:both}
.facts li{display:flex;gap:7px;align-items:flex-start;padding:2px 0}
.facts .ic{color:var(--acc);font-size:14px;margin-top:2px}
.callnum{font-size:26px;font-weight:700;color:var(--terra);text-align:center;margin:4px 0 14px;user-select:all;-webkit-user-select:all}
.callbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.callbtns .cta{justify-content:center;padding:12px 10px;font-size:15px;border:0;cursor:pointer}
.cta.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)!important}
.wifi .v{user-select:all;-webkit-user-select:all}
.introbox{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:color-mix(in srgb,var(--acc) 7%,var(--card));border:1px solid color-mix(in srgb,var(--acc) 38%,transparent);border-radius:14px;padding:12px 14px;margin:0 0 16px}
.introbox p{margin:0;font-size:14.5px;line-height:1.45;font-style:italic}
.introbox p b{font-style:normal;font-size:15.5px;color:var(--acc);display:block;margin-bottom:2px;text-align:left}
.sgroup+.sgroup{margin-top:26px}
.introbox .cir{background:var(--card)}
main [id]{scroll-margin-top:122px}
.cgrid>.card{margin-bottom:10px}
@media (min-width:1200px){
 main{padding:26px 48px 60px}
 .chips{margin:0 -48px 20px;padding:10px 48px}
 .cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px;align-items:stretch}
 .cgrid>.card{margin:0}
 .tgrid{align-items:start}
 .igrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 34px}
 .sh{padding:20px 26px}
 .home{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:48px;align-items:start}
 .hero{position:sticky;top:84px;text-align:left}
 .hero h1{font-size:44px}
 .hcol .quick{margin-top:6px}
 .eyebrow.wl{text-align:left}
 .home .cta{margin-left:0}
}
@media (min-width:1700px){.cgrid:not(.tgrid){grid-template-columns:repeat(3,minmax(0,1fr))}}
#rail .tool{width:100%;background:none;border:0;border-bottom:1px solid var(--line);font:inherit;color:var(--muted);cursor:pointer}
#rail .tool .ic{color:var(--muted)}
#rail .tool:hover .ic,#rail .tool:hover{color:var(--ink)}
#rail .tools{border-top:6px solid var(--line)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw;text-align:center}
.dlg p{margin:0 0 12px}
.dlg .cta{border:0;cursor:pointer}
#printAll{display:none}

/* ---- side menu motion ---- */
:root{--ease:cubic-bezier(.32,.72,0,1);--dur:.38s}
#rail{overflow-x:hidden;transition:width var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
main{transition:margin-left var(--dur) var(--ease)}
#rail .ri,#rail.open .ri,.wide:not(.rc) #rail .ri{flex-direction:row;justify-content:flex-start;gap:0;padding:0;min-height:54px;transition:background-color .2s}
#rail .ri .ic,#rail.open .ri>.ic,.wide:not(.rc) #rail .ri>.ic{flex:0 0 61px;width:61px;font-size:22px;text-align:center;display:flex;justify-content:center;transition:transform .2s var(--ease)}
#rail .ri:hover{background:var(--card)}
#rail .ri:hover>.ic{transform:scale(1.08)}
#rail .ri .nm,#rail .ri.tool .nm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:16px;opacity:0;transform:translateX(-10px);transition:opacity .16s ease,transform .16s ease;transition-delay:0s}
#rail.open .ri .nm,.wide:not(.rc) #rail .ri .nm{opacity:1;transform:none;transition:opacity .28s ease,transform .38s var(--ease);transition-delay:calc(70ms + var(--i,0) * 22ms)}
#rail .ri.on:after{transition:background-color .2s}
#rail .hd,#rail .ft{display:grid;grid-template-rows:0fr;opacity:0;padding-top:0;padding-bottom:0;border-bottom-color:transparent;transition:grid-template-rows var(--dur) var(--ease),opacity .18s ease,padding var(--dur) var(--ease)}
#rail .hd>*,#rail .ft>*{min-height:0;overflow:hidden}
#rail .hd b{white-space:nowrap}
#rail.open .hd,.wide:not(.rc) #rail .hd{grid-template-rows:1fr;opacity:1;padding:16px 16px 12px;border-bottom-color:var(--line);transition:grid-template-rows var(--dur) var(--ease),opacity .3s ease .1s,padding var(--dur) var(--ease)}
#rail.open .ft,.wide:not(.rc) #rail .ft{grid-template-rows:1fr;opacity:1;padding:14px 16px 24px;transition:grid-template-rows var(--dur) var(--ease),opacity .3s ease .18s,padding var(--dur) var(--ease)}
#scrim{display:block;opacity:0;pointer-events:none;transition:opacity var(--dur) var(--ease);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
#scrim.show{opacity:1;pointer-events:auto}
.wide #scrim{display:none}
#btnMenu svg{animation:mbtn .32s var(--ease)}
#rail .subs{display:grid;grid-template-rows:0fr;opacity:0;padding:0 0 0 61px;background:transparent;border-bottom:0 solid var(--line);transition:grid-template-rows var(--dur) var(--ease),opacity .16s ease}
#rail .subs>div{min-height:0;overflow:hidden}
#rail .subs a{display:block;font-size:14px;color:var(--muted);text-decoration:none;padding:5px 16px 5px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .2s}
#rail .subs a:first-child{padding-top:0}#rail .subs a:last-child{padding-bottom:12px}
#rail .subs a:hover{color:var(--acc)}
#rail.open .ri.on+.subs,.wide:not(.rc) #rail .ri.on+.subs{display:grid;grid-template-rows:1fr;opacity:1;border-bottom-width:1px;transition:grid-template-rows var(--dur) var(--ease),opacity .3s ease .12s}
#rail .ri.on:has(+.subs){border-bottom-color:transparent}
#rail .ri.on+.subs{background:var(--card)}
@keyframes mbtn{from{opacity:0;transform:rotate(-90deg) scale(.6)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#rail,main,#scrim,#rail *{transition:none!important}#btnMenu svg{animation:none}}
@media print{
 @page{size:A4;margin:12mm}
 html,body{background:#fff!important}
 body{-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:12.5px}
 body>*:not(#printAll){display:none!important}
 #printAll{display:block}
 #printAll .sheet,#printAll .home{break-before:page;margin:0}
 #printAll .home{break-before:auto}
 #printAll .quick,#printAll .cta,#printAll .pfi,#printAll .copy{display:none!important}
 #printAll .card,#printAll .item,#printAll .row,#printAll .sight,#printAll .hosp,#printAll .trip,#printAll .emg,#printAll .wifi,#printAll .sched{break-inside:avoid}
 #printAll .page{animation:none}
 #printAll .hero .illus{max-height:90mm;width:auto;margin:0 auto}
}

<script data-hb>
'use strict';
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get('hb-lang')==='it'?'it':'en';
let theme=store.get('hb-theme')||'day';
let pendingAnchor=null;
const tr=(en,it)=>lang==='it'?it:en;
const missing=[];
function ic(n,cls){const b=ICONS[n];if(!b){missing.push('icon:'+n);return''}return `<svg class="ic ${cls||''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${b}</svg>`}
function url(page,name){let best=null;for(const [p,t,u] of LINKS){if(p!==page)continue;if(t.startsWith(name)||name.startsWith(t)){if(!best||t.length>best[0].length)best=[t,u]}}if(!best){missing.push('link:'+page+':'+name);return'#'}return best[1]}
const ext=u=>window.HB_STANDALONE?`href="${u}" target="_blank" rel="noopener"`:`href="${u}"`;
const pinned=t=>{const m=/^(.*?)(\S+)$/s.exec(t.trim());return m?`${m[1]}<span class="nw">${m[2]}&nbsp;${ic('pinS')}</span>`:t};
const mp=(page,key,label)=>`<a class="place" ${ext(url(page,key))}>${pinned(label||key.replace(/&/g,'&amp;'))}</a>`;
const tel=(num,cls)=>`<a class="${cls||'tel'}" href="tel:${num.replace(/\s/g,'')}">${num}</a>`;
const km=d=>lang==='it'?d.replace('.',','):d;
const dist=(d,min,u)=>{const inner=`≈ ${km(d)} · ${ic('walk')} ${min} min`;return u?`<a class="pill" ${ext(u)}>${inner}</a>`:`<span class="pill">${inner}</span>`};
const cir=n=>`<span class="cir">${ic(n)}</span>`;
const h2=(icon,text,id,ruled)=>`<h2 class="h2${ruled?' ruled':''}" id="${id||''}">${cir(icon)}${text}</h2>`;
const part=(text,id)=>`<div class="part" id="${id||''}">${text}</div>`;

P.transport=s=>{
 const pu=mp(8,'Piazzale Ungheria'),ao=mp(8,'APCOA Orlando');
 const pc=url(8,'prestiaecomande.it'),ti=url(8,'trenitalia.com');
 const stop=(k,l,d,m)=>`<div class="stop">${mp(8,k,l)}${dist(d,m,url(8,k))}</div>`;
 const buy=u=>`<a class="buy" ${ext(u)}>${tr('Buy','Acquista')}</a>`;
 const L={tk:tr('Ticket','Biglietto'),jr:tr('Journey','Durata'),fr:tr('Frequency','Frequenza'),to:tr('To the airport','Verso l’aeroporto'),from:tr('From the airport','Dall’aeroporto'),
  ns:tr('Nearest stop<small>on foot from the apartment</small>','Fermata più vicina<small>a piedi dall’appartamento</small>')};
 const cs=tr('Central Station','Stazione Centrale'),fcs=tr('from Central Station','dalla Stazione Centrale');
 const fl=(a,b)=>tr(`First <b>${a}</b> · last <b>${b}</b>`,`Prima <b>${a}</b> · ultima <b>${b}</b>`);
 const rows=r=>r.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');
 return sheet(s,8,0,`
 ${h2('carfront',tr('Driving and parking','Auto e parcheggio'),'parking')}
 <div class="prose"><p>${tr(`If you’re coming by car, please note that Palermo’s old town is a <b>Limited Traffic Zone (ZTL)</b>: the daily pass costs <b>€5.00</b> and must be activated <b>before</b> you enter. You can buy it online, in the PalerMobilità (AMAT) app or at authorised points of sale. In any case, we don’t recommend driving in the city: parking is hard to find and, in the old town, the streets are very narrow and there are many pedestrian areas. Our apartment is outside the ZTL and, right in front of the building, you’ll find the pay-and-display <b>car park</b> in ${pu}, where you can also pick up shared bikes and cars. About 400 m away is the ${ao} underground <b>car park</b> (Piazza Vittorio Emanuele Orlando, 49), next to the Palermo Courthouse: open 24 hours a day, <b>€3.00</b> per hour, up to a maximum of <b>€14.00</b> per day, payable via the APCOA FLOW app.`,
 `Se arrivate in auto, tenete presente che il centro storico di Palermo è una <b>Zona a Traffico Limitato (ZTL)</b>: il pass giornaliero costa <b>5,00 €</b> e va attivato <b>prima</b> di entrare. Potete acquistarlo online, nell’app PalerMobilità (AMAT) o nei punti vendita autorizzati. In ogni caso sconsigliamo di guidare in città: parcheggiare è difficile e, nel centro storico, le strade sono molto strette e ci sono molte aree pedonali. Il nostro appartamento è fuori dalla ZTL e, proprio davanti all’edificio, troverete il <b>parcheggio</b> a pagamento di ${pu}, dove potete anche prendere bici e auto in sharing. A circa 400 m si trova il <b>parcheggio</b> sotterraneo ${ao} (Piazza Vittorio Emanuele Orlando, 49), accanto al Tribunale di Palermo: aperto 24 ore su 24, <b>3,00 €</b> l’ora, fino a un massimo di <b>14,00 €</b> al giorno, pagabile tramite l’app APCOA FLOW.`)}</p></div>
 <div class="pills" style="justify-content:space-around">${apps('AMAT',AMAT_IOS(),AMAT_AND())}${apps('APCOA',APCOA_IOS,APCOA_AND)}</div>
 ${h2('plane',tr('Airport connections','Collegamenti con l’aeroporto'),'airport')}
 <p class="intro">${tr('To travel to and from Palermo airport you can take the <b>shuttle bus Prestia e Comandè</b> or the <b>regional train</b>. There is no metro line to the airport.','Per andare e tornare dall’aeroporto di Palermo potete prendere il <b>bus navetta Prestia e Comandè</b> o il <b>treno regionale</b>. Non esiste una linea metropolitana per l’aeroporto.')}</p>
 <div class="cmp">
  <div class="card"><div class="hd">${cir('bus')}<div><b>${tr('Shuttle bus','Bus navetta')}</b><small>Prestia e Comandè</small></div></div><dl>${rows([
   [L.tk,buy(pc)+tr('<b>€6</b> one way · <b>€10</b> return<br><small>(€6.50 / €11 if bought on board)</small>','<b>6 €</b> sola andata · <b>10 €</b> andata e ritorno<br><small>(6,50 € / 11 € se acquistato a bordo)</small>')],
   [L.jr,tr('<b>40 min</b> to Politeama<br><b>50 min</b> to Central Station','<b>40 min</b> fino al Politeama<br><b>50 min</b> fino alla Stazione Centrale')],
   [L.fr,tr('Every <b>30 min</b>, every day','Ogni <b>30 min</b>, tutti i giorni')],
   [L.to,fl('03:30','21:30')+`<br><small>${fcs}</small>`],
   [L.from,fl('05:05','01:05')],
   [L.ns,stop('Politeama · Piazza C','Politeama · Piazza Castelnuovo','550 m',7)]])}</dl></div>
  <div class="card"><div class="hd">${cir('train')}<div><b>${tr('Train','Treno')}</b><small>${tr('Trenitalia, regional','Trenitalia, regionale')}</small></div></div><dl>${rows([
   [L.tk,buy(ti)+tr('<b>€6.80</b> one way','<b>6,80 €</b> sola andata')],
   [L.jr,tr('≈ <b>35 min</b> from Notarbartolo<br>≈ <b>1 h</b> from Central Station','≈ <b>35 min</b> da Notarbartolo<br>≈ <b>1 h</b> dalla Stazione Centrale')],
   [L.fr,tr('Every <b>30–60 min</b>, every day','Ogni <b>30–60 min</b>, tutti i giorni')],
   [L.to,fl('04:00','22:12')+`<br><small>${fcs}</small>`],
   [L.from,tr('First <b>05:18</b> · last <b>00:20</b>','Primo <b>05:18</b> · ultimo <b>00:20</b>')],
   [L.ns,stop('Notarbartolo','Notarbartolo','2.1 km',28)+stop('Lolli','Lolli','870 m',12)+stop('Central S',cs,'2.0 km',27)]])}</dl></div>
 </div>
 <p class="fine">${tr(`Fares and times are approximate and may change: please check <a ${ext(pc)}>prestiaecomande.it</a> and <a ${ext(ti)}>trenitalia.com</a> before you travel.`,`Tariffe e orari sono indicativi e possono variare: controllate <a ${ext(pc)}>prestiaecomande.it</a> e <a ${ext(ti)}>trenitalia.com</a> prima di partire.`)}</p>
 <div class="duo">
  <div>${cir('car')}<div>${tr('<b>Private transfer: €60</b>, or <b>€80</b> after 22:00. No waiting, no stops, and drop-off right in front of the building at any hour. The service is run by an independent driver, not by us. Ask us for details.','<b>Transfer privato: 60 €</b>, oppure <b>80 €</b> dopo le 22:00. Nessuna attesa, nessuna fermata e arrivo proprio davanti all’edificio a qualsiasi ora. Il servizio è gestito da un autista indipendente, non da noi. Chiedeteci i dettagli.')}</div></div>
  <div>${cir('taxi')}<div>${tr('<b>Taxi:</b> fixed fare of about <b>€50–60</b> for a 35–40 min ride. The easiest choice for late flights.','<b>Taxi:</b> tariffa fissa di circa <b>50–60 €</b> per un tragitto di 35–40 min. La scelta più semplice per i voli in tarda serata.')}<br><b>Radio Taxi Trinacria</b> <a href="tel:+390916878">+39 091 6878</a><br><b>Autoradio Taxi</b> <a href="tel:+390918481">+39 091 8481</a></div></div>
 </div>`);
};

/* generic place list */
const plist=(page,rows,one)=>`<div class="list${one?' one':''}">${[0,1].map(c=>{const half=one?rows.length:Math.ceil(rows.length/2);const part=c?rows.slice(half):rows.slice(0,half);return part.length?`<div>${part.map(([n,a,d,m,x])=>`<div class="row"><div><div class="t">${mp(page,n,x?`${n} <small>(${x})</small>`:n)}</div><div class="a">${a}</div></div>${dist(d,m,url(page,n))}</div>`).join('')}</div>`:''}).join('')}</div>`;

 ${h2('info',tr('Tourist Information Centre','Centro di informazioni turistiche'),'tourist',1)}
 ${plist(9,[['CIT Teatro Massimo','Piazza Verdi · '+tr('Visitor Centre inside the Teatro Massimo','Visitor Centre all’interno del Teatro Massimo'),'290 m',4],['CIT Bellini','Via Maqueda, 191 · Piazza Bellini · '+t('+39 091 7408022'),'1.2 km',16]],1)}
 ${h2('cross',tr('Pharmacies','Farmacie'),'pharmacies',1)}
 ${plist(9,[['Farmacia Cacace','Piazza S. Francesco di Paola, 51 · '+t('+39 091 588313'),'86 m',1],['Farmacia Tamburello','Piazza Sant’Oliva, 37 · '+t('+39 091 585735'),'180 m',2],['Farmacia Inglese','Via Mariano Stabile, 175 · '+t('+39 091 334482')+' · '+tr('open 7 days a week','aperta 7 giorni su 7'),'300 m',4]],1)}
 ${h2('basket',tr('Supermarkets','Supermercati'),'supermarkets',1)}
 ${plist(9,[['Coop Supermarket','Piazza Francesco Bagnasco, 15','350 m',5],['Prezzemolo & Vitale – Via Di Stefano','Via Di Stefano · Piazza Francesco Bagnasco, 22','350 m',5],['Prezzemolo & Vitale – Villafranca','Via Principe di Villafranca, 20','350 m',5],['Famila 24H','Via della Libertà, 30/A','900 m',12]],1)}
 ${h2('washer',tr('Laundries','Lavanderie'),'laundries',1)}
 ${plist(9,[['Il Pinguino Lavasecco','Via Salvatore Meccio, 18','110 m',1],['L’oblò','Via Volturno, 62','400 m',5,tr('Launderette','Lavanderia self-service')]],1)}`);
};

/* 05 */
P.sights=s=>{
 const U='UNESCO';
 const groups=[
 ['centre',tr('City centre and Old town, from the Politeama to Quattro Canti','Centro e città vecchia, dal Politeama ai Quattro Canti'),tr('The heart of the city, from the theatres to Piazza Bellini, mostly on short walks.','Il cuore della città, dai teatri a Piazza Bellini, quasi tutto raggiungibile con brevi passeggiate.'),10,[
  ['Teatro Politeama',tr('A neoclassical theatre from the 1870s, with a triumphal arch crowned by a bronze quadriga. The palm-lined square is ideal for a stroll.','Teatro neoclassico degli anni Settanta dell’Ottocento, con un arco trionfale sormontato da una quadriga di bronzo. La piazza, circondata da palme, è ideale per una passeggiata.'),'520 m',7,[]],
  ['Teatro Massimo',tr('The largest opera house in Italy, opened in 1897 and featured in <i>The Godfather Part III</i>. Guided tours of the interiors are available.','Il più grande teatro lirico d’Italia, inaugurato nel 1897 e apparso ne <i>Il Padrino – Parte III</i>. Sono disponibili visite guidate degli interni.'),'290 m',4,[tr('Guided tours inside','Visite guidate all’interno')]],
  ['Museo Archeologico Salinas',tr('Sicily’s main archaeological museum, set in a former convent around a cloister. Don’t miss the Greek temple metopes from Selinunte.','Il principale museo archeologico della Sicilia, ospitato in un ex convento raccolto intorno a un chiostro. Da non perdere le metope dei templi greci di Selinunte.'),'660 m',9,[tr('Closed on Mondays','Chiuso il lunedì')]],
  ['Quattro Canti',tr('The baroque crossroads at the heart of the old town. Its four façades, with fountains and statues, divide the centre into four districts.','L’incrocio barocco nel cuore del centro storico. Le sue quattro facciate, con fontane e statue, dividono il centro in quattro quartieri.'),'1.1 km',14,[]],
  ['Piazza Pretoria',tr('Home of the Fontana Pretoria, a 16th-century marble masterpiece dubbed “Fontana della Vergogna” (Fountain of Shame) for its nude statues.','Ospita la Fontana Pretoria, capolavoro marmoreo del Cinquecento soprannominato “Fontana della Vergogna” per le sue statue nude.'),'1.1 km',15,[]],
  ['La Martorana & San Cataldo',tr('Two Arab-Norman churches in Piazza Bellini: La Martorana, with golden Byzantine mosaics, and San Cataldo, with its three red domes.','Due chiese arabo-normanne in Piazza Bellini: La Martorana, con i suoi mosaici bizantini dorati, e San Cataldo, con le sue tre cupole rosse.'),'1.2 km',17,[U]]]],
 ['arab',tr('From the Cattedrale to Castello della Zisa','Dalla Cattedrale al Castello della Zisa'),tr('Arab-Norman Palermo and some essential sights of the old town. Opening hours, closing days and ticket prices change during the year: check before you go.','La Palermo arabo-normanna e alcuni luoghi imperdibili del centro storico. Orari di apertura, giorni di chiusura e prezzi dei biglietti cambiano nel corso dell’anno: verificate prima di andare.'),11,[
  ['Cattedrale di Palermo',tr('Arab-Norman, Gothic and neoclassical styles in one building, consecrated in 1185. It holds royal tombs and has rooftop terraces over the city.','Stili arabo-normanno, gotico e neoclassico in un unico edificio, consacrato nel 1185. Custodisce le tombe reali e ha terrazze sui tetti con vista sulla città.'),'1.1 km',14,[U,tr('Rooftop terraces','Terrazze sui tetti')]],
  ['Porta Nuova',tr('A monumental city gate honouring Emperor Charles V, rebuilt in 1669 after a lightning strike and topped by a pyramid roof.','Monumentale porta della città in onore dell’imperatore Carlo V, ricostruita nel 1669 dopo un fulmine e sormontata da una copertura piramidale.'),'1.4 km',19,[]],
  ['Palazzo dei Normanni & Cappella Palatina',tr('The oldest royal residence in Europe and seat of the Sicilian Regional Assembly. Don’t miss the Cappella Palatina and its golden mosaics.','La più antica residenza reale d’Europa e sede dell’Assemblea Regionale Siciliana. Da non perdere la Cappella Palatina e i suoi mosaici dorati.'),'1.5 km',20,[U,tr('Golden mosaics','Mosaici dorati')]],
  ['Convento dei Cappuccini & Catacombe',tr('A convent famous for its catacombs, which hold the mummified remains of friars and Palermo’s citizens. Not for the faint-hearted.','Convento famoso per le sue catacombe, che custodiscono i resti mummificati di frati e cittadini palermitani. Non adatto ai più impressionabili.'),'2.1 km',28,[tr('No photos inside','Vietato fotografare all’interno')]],
  ['San Giovanni degli Eremiti',tr('A small Arab-Norman church with five red domes, set in a peaceful garden with a medieval cloister. Close to Palazzo dei Normanni.','Piccola chiesa arabo-normanna con cinque cupole rosse, immersa in un giardino tranquillo con un chiostro medievale. Vicino al Palazzo dei Normanni.'),'1.7 km',22,[U,tr('Cloister garden','Giardino del chiostro')]],
  ['Castello della Zisa',tr('A 12th-century Arab-Norman summer palace, known for its natural cooling system. It now houses the Museo di Arte Islamica.','Palazzo estivo arabo-normanno del XII secolo, noto per il suo sistema di raffrescamento naturale. Oggi ospita il Museo di Arte Islamica.'),'1.7 km',22,[U,'Museo di Arte Islamica']]]],
 ['markets',tr('Markets and seafront, from Capo to Orto Botanico','Mercati e lungomare, dal Capo all’Orto Botanico'),tr('From the markets to the sea. The markets are liveliest in the morning, the seafront at the end of the day; some stops are easier to reach by bus or taxi.','Dai mercati al mare. I mercati sono più vivaci al mattino, il lungomare a fine giornata; alcune tappe si raggiungono più facilmente in autobus o in taxi.'),12,[
  ['Mercato del Capo',tr('One of Palermo’s historic street markets, with stalls of fruit and vegetables, fresh fish and Sicilian street food.','Uno dei mercati storici di Palermo, con bancarelle di frutta e verdura, pesce fresco e street food siciliano.'),'410 m',5,[tr('Closest sight','Il più vicino'),'Street food']],
  ['Mercato della Vucciria',tr('A historic market district known for fresh fish, street food stalls and a lively atmosphere in the evening.','Storico quartiere del mercato, noto per il pesce fresco, le bancarelle di street food e l’atmosfera vivace la sera.'),'1.2 km',16,[tr('Evening street food','Street food serale')]],
  ['Mercato di Ballarò',tr('One of Palermo’s oldest and liveliest markets: spices, produce, fish and street food in a maze of lanes in the Albergheria district.','Uno dei mercati più antichi e vivaci di Palermo: spezie, frutta e verdura, pesce e street food in un labirinto di vicoli nel quartiere dell’Albergheria.'),'1.7 km',23,['Street food']],
  ['Foro Italico & Porta Felice',tr('The monumental Porta Felice, at the end of Corso Vittorio Emanuele, opens onto the Foro Italico, a seafront promenade of lawns and palms.','La monumentale Porta Felice, in fondo a Corso Vittorio Emanuele, si apre sul Foro Italico, una passeggiata a mare tra prati e palme.'),'1.9 km',26,[tr('Seafront promenade','Passeggiata a mare')]],
  ['Molo Trapezoidale',tr('A pedestrian pier by the marina, with cafés, restaurants and a fountain: ideal for an evening stroll among the boats.','Molo pedonale accanto al porto turistico, con caffè, ristoranti e una fontana: ideale per una passeggiata serale tra le barche.'),'1.8 km',24,[tr('Marina walk','Passeggiata al porto')]],
  ['Orto Botanico',tr('A peaceful botanical garden founded in 1789, with palms, greenhouses and water-lily ponds. Villa Giulia park is right next door.','Tranquillo giardino botanico fondato nel 1789, con palme, serre e vasche di ninfee. Il parco di Villa Giulia è proprio accanto.'),'2.3 km',31,[tr('Giant ficus trees','Ficus giganti')]]]]];
 const GI={centre:'domeTheatre',arab:'church',markets:'basket'};
 return sheet(s,10,0,groups.map(([id,sub,intro,pg,items])=>`<div class="sgroup" id="${{centre:'p10',arab:'p11',markets:'p12'}[id]}"><div class="introbox">${cir(GI[id])}<p>${sub?`<b>${sub}</b>`:''}${intro}</p></div>
  <div class="cgrid">${items.map(([n,d,di,m,tags],i)=>{const u=url(pg,n);return `<article class="card sight"><a class="thumb" ${ext(u)} tabindex="-1"><img src="${IMG['s'+pg+'_'+i]}" alt="${tr('Illustration','Illustrazione')}: ${n}" loading="lazy"></a><div class="b"><h3>${mp(pg,n)}</h3><p>${d}</p><div class="pills">${dist(di,m,u)}${tags.map(t=>`<span class="pill${t==='UNESCO'?' solid':''}">${t}</span>`).join('')}</div></div></article>`}).join('')}</div></div>`).join(''));
};

/* 05b */
P['off-the-beaten-track']=s=>{
 const Q='https://www.google.com/maps/search/?api=1&query=';
 const items=[
  ['Oratorio di Santa Cita','Oratorio%20di%20Santa%20Cita%2C%20Palermo','Via Valverde, 3',
   tr('A small oratory covered in white stucco by Giacomo Serpotta: playful putti, theatrical scenes and a relief of the Battle of Lepanto.','Un piccolo oratorio ricoperto di stucchi bianchi di Giacomo Serpotta: putti giocosi, scene teatrali e un rilievo della Battaglia di Lepanto.'),'850 m',11,['Serpotta']],
  ['Chiesa di San Giuseppe dei Teatini','Chiesa%20di%20San%20Giuseppe%20dei%20Teatini%2C%20Palermo','Corso Vittorio Emanuele · Quattro Canti',
   tr('A baroque church right by the Quattro Canti, with a bright dome and a lavish interior of marble, stucco and frescoes.','Una chiesa barocca proprio ai Quattro Canti, con una cupola luminosa e un sontuoso interno di marmi, stucchi e affreschi.'),'1.1 km',14,[tr('Baroque','Barocco')]],
  ['Chiesa e Chiostro di Santa Caterina d’Alessandria','Chiesa%20di%20Santa%20Caterina%20d%27Alessandria%2C%20Palermo','Piazza Bellini',
   tr('A sumptuous baroque church in Piazza Pretoria. Visit the cloister of the former convent and the rooftop terrace, with views over the square and the old town.','Una sontuosa chiesa barocca in Piazza Pretoria. Si visitano il chiostro dell’ex monastero e la terrazza sui tetti, con vista sulla piazza e sul centro storico.'),'1.2 km',16,[]],
  ['Oratorio del Rosario di San Domenico','Oratorio%20del%20Rosario%20di%20San%20Domenico%2C%20Palermo','Via dei Bambinai',
   tr('Another Serpotta masterpiece, with an altarpiece by Anthony van Dyck. A short walk from the Vucciria market.','Un altro capolavoro del Serpotta, con una pala d’altare di Antoon van Dyck. A pochi passi dal mercato della Vucciria.'),'1.3 km',17,['Serpotta · Van Dyck']],
  ['Chiesa del Gesù (Casa Professa)','Chiesa%20del%20Ges%C3%B9%20Casa%20Professa%2C%20Palermo','Piazza Casa Professa, 21',
   tr('A plain façade hides one of Palermo’s richest baroque interiors, full of marble, stucco and frescoes. Next to the Ballarò market.','Una facciata semplice nasconde uno degli interni barocchi più ricchi di Palermo, tra marmi, stucchi e affreschi. Accanto al mercato di Ballarò.'),'1.4 km',18,[tr('Baroque','Barocco')]],
  ['Oratorio di San Lorenzo','Oratorio%20di%20San%20Lorenzo%2C%20Palermo','Via dell’Immacolatella, 5',
   tr('A small oratory with Serpotta’s stucco, next to the church of San Francesco. A copy of Caravaggio’s “Nativity”, stolen in 1969, is on display.','Un piccolo oratorio con gli stucchi del Serpotta, accanto alla chiesa di San Francesco. È esposta una copia della «Natività» di Caravaggio, rubata nel 1969.'),'1.5 km',20,[tr('Serpotta · Caravaggio (copy)','Serpotta · Caravaggio (copia)')]],
  ['Palazzo Abatellis','Palazzo%20Abatellis%2C%20Palermo','Via Alloro, 4',
   tr('A 15th-century palace that houses the Galleria Regionale, home of the famous fresco “The Triumph of Death”.','Un palazzo del Quattrocento che ospita la Galleria Regionale, dove si trova il celebre affresco del «Trionfo della Morte».'),'1.8 km',24,[tr('Museum','Museo')]],
  ['Santa Maria dello Spasimo','Santa%20Maria%20dello%20Spasimo%2C%20Palermo','Via dello Spasimo, 15',
   tr('A roofless 16th-century church in the Kalsa, left unfinished and now used for concerts and events.','Una chiesa cinquecentesca senza tetto nella Kalsa, rimasta incompiuta e oggi usata per concerti ed eventi.'),'1.9 km',25,[tr('Open sky','A cielo aperto')]],
  ['Museo delle Marionette Pasqualino','Museo%20internazionale%20delle%20Marionette%20Antonio%20Pasqualino%2C%20Palermo','Piazzetta Antonio Pasqualino, 5',
   tr('Sicilian puppets (pupi) and puppet theatre from around the world: about 5,000 pieces.','Pupi siciliani e teatro di figura da tutto il mondo: circa 5.000 pezzi.'),'1.9 km',25,[tr('Families','Famiglie')]],
  ['Ponte dell’Ammiraglio','Ponte%20dell%27Ammiraglio%2C%20Palermo','Corso dei Mille',
   tr('A 12th-century Norman bridge, part of the Arab-Norman itinerary. It once crossed a river that has since been diverted.','Un ponte normanno del XII secolo, parte dell’itinerario arabo-normanno. Un tempo attraversava un fiume che è stato poi deviato.'),'2.7 km',36,['UNESCO']]];
 return sheet(s,0,0,`<div class="sgroup" id="gems"><div class="introbox">${cir('signpost')}<p>${tr('Ten quieter places worth a detour, away from the usual crowds.','Dieci luoghi più tranquilli che meritano una deviazione, lontano dalla folla.')}</p></div>
 <div class="cgrid">${items.map(([n,q,ad,d,di,m,tags],i)=>{const u=Q+q;return `<article class="card sight"><a class="thumb" ${ext(u)} tabindex="-1"><img src="${IMG['ob'+i]}" alt="${tr('Illustration','Illustrazione')}: ${n}" loading="lazy"></a><div class="b"><h3><a class="place" ${ext(u)}>${pinned(n)}</a></h3><p class="addr">${ad}</p><p>${d}</p><div class="pills">${dist(di,m,u)}${tags.map(t=>`<span class="pill${t==='UNESCO'?' solid':''}">${t}</span>`).join('')}</div></div></article>`}).join('')}</div></div>`);
};

/* 06 */
P['day-trips']=s=>{
 const amat=`<a class="x" ${ext(url(13,'amat.pa.it'))}>amat.pa.it</a>`;

document.getElementById('lEn').addEventListener('click',()=>setLang('en'));
document.getElementById('lIt').addEventListener('click',()=>setLang('it'));
render();

</script>
